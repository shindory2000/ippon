<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="/ippon/nj-db.js"></script></head><body><title>NIJIRI 一本</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 届いて、飲む前は夜の瓶の色。飲んでからは白い間で、読みやすく。朱は一色、影なし */
:root{
  --night:#101712; --night-2:#18211b; --on-night:#f3f1ea; --on-night-soft:#b9bfb5; --night-line:#2c3a30;
  --ground:#fbfbf8; --ink:#16201a; --ink-soft:#46504a; --ink-faint:#8d958f; --line:#dfe2dc;
  --shu:#b3362a; --shu-deep:#8e2a20; --on-shu:#fff;
  --outside:#0b0f0c; --glow:#e9e4d2; --door:#2b2a24; --lattice:#3a382f;
  --f-num:"Shippori Mincho B1","Hiragino Mincho ProN",serif;
  --f-text:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --ease:cubic-bezier(.12,.9,.18,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--f-text);font-size:16px;line-height:1.85;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-feature-settings:"palt" 1;overflow-x:clip}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
.in{max-width:460px;margin:0 auto;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
h2{font-weight:700;font-size:30px;line-height:1.25;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{margin-top:14px;color:var(--ink-soft);font-size:15px}

/* 入口 */
#gate{position:fixed;inset:0;z-index:20;background:var(--outside);display:grid;place-items:center;cursor:pointer;clip-path:inset(0);transition:clip-path 1.1s var(--ease),opacity .4s linear}
#gate.through{clip-path:inset(50% 50% 50% 50%);opacity:0;pointer-events:none}
.door{position:relative;width:88px;height:96px;overflow:hidden;background:var(--glow);transition:transform 1.3s var(--ease)}
.door::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 100%,#fff 0,var(--glow) 45%,#b9b29a 100%)}
.door .to{position:absolute;inset:0;z-index:2;background:var(--door);background-image:repeating-linear-gradient(90deg,transparent 0 21px,var(--lattice) 21px 22px),repeating-linear-gradient(0deg,transparent 0 23px,var(--lattice) 23px 24px);transition:transform 1.1s var(--ease)}
#gate.open .to{transform:translateX(100%)}
#gate.in .door{transform:scale(9)}
.gate-word{position:absolute;bottom:calc(18% + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#cfcab8;font-size:15px;letter-spacing:.3em;transition:opacity .5s linear}
#gate.in .gate-word{opacity:0}

/* 1 飲む前 */
.mae{background:var(--night);color:var(--on-night);padding-top:calc(48px + env(safe-area-inset-top,0px));padding-bottom:64px}
.seal{width:52px;height:52px;display:block;transform-origin:50% 60%;transform:rotate(-2deg)}
.seal.pre{opacity:0}
.seal.stamp{animation:stamp .7s var(--ease) both}
@keyframes stamp{0%{transform:scale(1.5) rotate(-6deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(-2deg);opacity:1}}
.no{margin-top:30px;font-family:var(--f-num);font-size:15px;letter-spacing:.12em;color:var(--on-night-soft);font-variant-numeric:tabular-nums}
.name{font-weight:700;font-size:60px;line-height:1.05;margin:8px 0 0;letter-spacing:.02em}
.name.pre{opacity:0}
.name.up{animation:up 1.2s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(26px);clip-path:inset(0 0 100% 0)}to{opacity:1;transform:none;clip-path:inset(0 0 0 0)}}
.origin{margin-top:14px;font-size:15px;color:var(--on-night-soft)}
.uri{margin-top:42px;font-size:22px;font-weight:700;line-height:1.55}
.eng{margin-top:8px;font-size:13px;color:var(--on-night-soft);letter-spacing:.02em}
.kazu{margin:38px 0 0;display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--night-line)}
.kazu div{padding:16px 8px 0 0;min-width:0}
.kazu b{display:block;font-family:var(--f-num);font-size:38px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--on-night)}
.kazu b small{font-size:15px;margin-left:2px}
.kazu span{display:block;margin-top:6px;font-size:13px;color:var(--on-night-soft);line-height:1.5}
.denrai{margin-top:76px}
.denrai .kicker{font-size:19px;font-weight:700;color:var(--on-night)}
.nin{display:flex;flex-wrap:wrap;align-items:flex-end;column-gap:10px;margin-top:6px;line-height:1}
.nin .lead-in{flex-basis:100%;font-size:18px;font-weight:700;margin:22px 0 6px}
.nin .k{font-family:var(--f-num);font-size:120px;font-variant-numeric:lining-nums;font-weight:700;color:var(--shu);letter-spacing:-.04em;margin-bottom:-8px}
.nin .s{font-size:18px;font-weight:700;padding-bottom:12px}
.yurai{margin-top:18px;font-size:15px;color:#d3d8cf;line-height:1.85;letter-spacing:-.01em}
.yurai rt{font-size:8px;color:var(--on-night-soft)}
.ima{margin-top:20px;font-size:19px;font-weight:500;line-height:1.8}
.nomikata{margin:64px 0 0;padding:0;list-style:none;border-top:1px solid var(--night-line)}
.nomikata li{display:grid;grid-template-columns:2.2em 1fr;padding:16px 0;border-bottom:1px solid var(--night-line)}
.nomikata .n{font-family:var(--f-num);font-size:22px;color:var(--shu);line-height:1.3}
.nomikata b{display:block;font-size:18px;line-height:1.4}
.nomikata span{font-size:14px;color:var(--on-night-soft)}
.toi{margin-top:64px;font-size:24px;font-weight:700;line-height:1.6}
.toi-sub{margin-top:10px;font-size:15px;color:var(--on-night-soft)}
.nonda{margin-top:30px;display:block;width:100%;border:0;border-radius:6px;background:var(--shu);color:var(--on-shu);font-size:18px;font-weight:700;letter-spacing:.08em;padding:18px 20px;cursor:pointer;box-shadow:0 5px 0 var(--shu-deep);transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.nonda:active{transform:translateY(5px);box-shadow:0 0 0 var(--shu-deep)}

/* 2 答え合わせ */
.awase{padding-top:72px}
.erabu{margin-top:26px;border-top:1px solid var(--ink)}
.erabu label{position:relative;display:block;padding:15px 14px;border-bottom:1px solid var(--line);font-size:18px;font-weight:500;cursor:pointer}
.erabu input{position:absolute;opacity:0;pointer-events:none}
.erabu label:has(input:focus-visible){outline:2px solid var(--shu);outline-offset:-2px}
.erabu input:checked{border:6px solid var(--shu)}
.erabu label:has(input:checked){color:var(--shu)}
.mae .erabu{border-top-color:var(--night-line)}
.mae .erabu label{border-bottom-color:var(--night-line);color:var(--on-night);transition:background .3s var(--ease),color .3s var(--ease)}
.mae .erabu label:active{background:var(--night-2)}
.mae .erabu label:has(input:checked){background:var(--shu);color:var(--on-shu)}
.mae .field label{color:var(--on-night-soft)}
.mae .field input{color:var(--on-night);border-bottom-color:var(--night-line)}
.mae .msg{color:#e88a7f}
.nonda[disabled]{opacity:.35;box-shadow:none;cursor:default}
.field{display:grid;gap:4px;min-width:0;margin-top:22px}
.field label{font-size:13px;color:var(--ink-soft)}
.field input,.field textarea,.field select{width:100%;border:0;border-bottom:1.5px solid var(--ink-faint);background:transparent;padding:10px 0;font-size:17px;color:var(--ink);border-radius:0;-webkit-appearance:none;appearance:none;min-height:46px}
.field textarea{resize:vertical;line-height:1.8;min-height:110px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-bottom-color:var(--shu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.two>*{min-width:0}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.three>*{min-width:0}
.oshi{margin-top:26px;border:0;border-radius:6px;background:var(--ink);color:var(--ground);font-size:17px;font-weight:700;letter-spacing:.06em;padding:16px 26px;cursor:pointer;box-shadow:0 5px 0 #000;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
.oshi:active{transform:translateY(5px);box-shadow:0 0 0 #000}
.oshi[disabled]{background:var(--ink-faint);box-shadow:0 5px 0 var(--ink-soft);cursor:default}
.textbtn{border:0;background:none;border-bottom:1px solid var(--ink-faint);padding:4px 0;font-size:14px;color:var(--ink-soft);cursor:pointer}
.msg{margin-top:10px;font-size:14px;color:var(--shu);min-height:1.4em}
.ans{margin-top:44px}
.ans.show{animation:rise .9s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.chashi-ans{font-size:15px;color:var(--ink-soft)}
.chashi-w{margin-top:6px;font-weight:700;font-size:40px;line-height:1.2}
.chashi-w em{font-style:normal;color:var(--shu);display:inline-block;transform-origin:30% 60%}
.ans.show .chashi-w em{animation:oshi .8s var(--ease) both}
@keyframes oshi{0%{transform:scale(1.6) rotate(-4deg);opacity:0}55%{opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
.chashi-p{margin-top:16px;font-size:17px;line-height:2}
.chashi-cite{margin-top:8px;font-size:13px;color:var(--ink-soft)}
.douji{margin-top:22px;font-size:17px;font-weight:700}
.minna{margin-top:36px}
.minna h3{font-size:15px;font-weight:500;color:var(--ink-soft);margin:0}
.bar{display:grid;grid-template-columns:7em 1fr 3em;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.bar i{display:block;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i b{display:block;height:100%;background:var(--ink)}
.bar.mine i b{background:var(--shu)}
.bar.mine{color:var(--shu);font-weight:700}
.bar span{text-align:right;font-variant-numeric:tabular-nums}
.chart{margin-top:30px;width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f-text);font-size:11px;fill:var(--ink-soft)}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .me{fill:var(--ink)}
.chart .me-l{fill:var(--ink);font-size:13px;font-weight:700}
.chart .you{fill:none;stroke:var(--shu);stroke-width:2.5}
.chart .you-l{fill:var(--shu);font-size:13px;font-weight:700}
.chart-l{margin-top:4px;font-size:13px;color:var(--ink-soft);text-align:center}
.mini.mouhitori{margin:34px 0 0}
.minna-w{margin-top:10px;font-size:18px;line-height:1.8}
.minna-w .mine{color:var(--shu);font-weight:700}

/* 3 つながり */
.tsunagari{margin-top:96px;padding-top:72px;border-top:1px solid var(--ink)}
.in>.tsunagari:first-child{margin-top:0;border-top:0}
.soukei{margin-top:26px;display:grid;grid-template-columns:repeat(2,1fr);gap:0 18px}
.soukei div{padding:12px 0;border-top:1px solid var(--line)}
.soukei b{display:block;font-family:var(--f-num);font-size:40px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.soukei span{font-size:13px;color:var(--ink-soft)}
.tree{position:relative;margin-top:40px}
.tree svg{position:absolute;left:0;top:0;width:28px;height:100%;overflow:visible}
.tree path{fill:none;stroke:var(--ink);stroke-width:1.4}
.tree .side{stroke:var(--ink-faint);stroke-dasharray:2 4}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);transition:stroke-dashoffset 1.6s var(--ease)}
.drawn .draw{stroke-dashoffset:0}
.hito{position:relative;padding:0 0 26px 44px}
.hito .who{font-size:14px;color:var(--ink-soft)}
.hito .kotoba{font-size:17px;line-height:1.7}
.hito.you .who{color:var(--shu);font-weight:700}
.hito.empty .kotoba{color:var(--ink-faint);font-size:15px}
.hito.branch{padding-left:72px;padding-bottom:16px}
.hito.branch .who{color:var(--ink-faint)}
.hito.branch .kotoba{font-size:15px;color:var(--ink-soft)}
.hito .re{margin-top:4px;font-size:14px;color:var(--shu)}
.hito.other{margin-top:22px;padding:18px 0 10px;border-top:1px solid var(--line)}
.hito.other .who{font-size:14px;font-weight:700;color:var(--ink-soft)}
.hito.other~.hito.branch{padding-left:0}
.fuu{margin-top:30px;width:100%;border-collapse:collapse;font-size:15px}
.fuu th,.fuu td{text-align:left;padding:12px 6px 12px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
.fuu th{font-weight:500}
.fuu td{color:var(--ink-soft);font-variant-numeric:tabular-nums}

/* 4 一言 */
.hitokoto{margin-top:96px;padding-top:72px;border-top:1px solid var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:22px;font-size:15px;line-height:1.6;cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:2px 0 0;border:1.5px solid var(--ink-soft);border-radius:3px;display:grid;place-items:center}
.check input:checked{border-color:var(--shu);background:var(--shu)}
.check input:checked::after{content:"";width:9px;height:5px;border:2px solid var(--on-shu);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.voices{margin-top:34px}
.voice{padding:18px 0;border-top:1px solid var(--line)}
.voice .who{font-size:13px;color:var(--ink-soft)}
.voice .k{margin-top:4px;font-size:17px;line-height:1.85}
.voice .re{margin-top:10px;padding-left:14px;font-size:15px;color:var(--ink-soft);line-height:1.8}
.voice .re b{display:block;font-size:12px;color:var(--shu);font-weight:500}
.done-note{margin-top:16px;font-size:15px;color:var(--ink-soft)}

/* 5 次の一本 */
.tsugi{margin-top:96px;padding-top:72px;border-top:1px solid var(--ink)}
.jijitsu{margin:26px 0 0;display:grid;grid-template-columns:auto 1fr;border-top:1px solid var(--line)}
.jijitsu dt,.jijitsu dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.jijitsu dt{font-size:14px;color:var(--ink-soft);white-space:nowrap;padding-right:22px}
.jijitsu dd{font-size:16px;min-width:0}
.jijitsu dd b{font-family:var(--f-num);font-size:22px}
.shimekiri{margin-top:22px;font-size:18px;font-weight:700;line-height:1.7}
.order{margin-top:10px}
.line{display:flex;align-items:flex-end;gap:8px}.line input{flex:1;min-width:0}.tail{font-size:16px;padding-bottom:12px;white-space:nowrap}
.how{margin-top:16px;font-size:13.5px;color:var(--ink-soft);line-height:1.85}
.nedan{margin-top:18px;font-size:17px;font-weight:700}
.hold{position:relative;display:grid;place-items:center;margin:36px auto 0;width:168px;height:168px;border:0;background:none;padding:0;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .track{fill:none;stroke:var(--line);stroke-width:2}
.hold .fill{fill:none;stroke:var(--shu);stroke-width:4}
.hold .core{width:110px;height:110px;border-radius:50%;background:var(--shu);color:var(--on-shu);display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1.45;text-align:center;transition:transform .6s var(--ease)}
.hold.pressing .core{transform:scale(.9)}
.hold.burst .core{animation:burst .6s var(--ease)}
@keyframes burst{0%{transform:scale(.86)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.hold.owari{cursor:default}.hold.owari .core{background:var(--ground);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.hint{text-align:center;font-size:14px;color:var(--ink-soft);margin-top:14px;min-height:1.5em}
.uketa{margin-top:36px;font-size:20px;font-weight:700;line-height:1.6}
.uketa .seal{display:block;width:44px;height:44px;margin-bottom:14px}
.uketa span{display:block}
.uketa b{color:var(--shu)}
.mini{display:grid;place-items:center;margin:30px auto 0;width:96px;height:96px;border-radius:50%;border:2px solid var(--shu);background:transparent;color:var(--shu);font-size:14px;font-weight:700;line-height:1.45;cursor:pointer;transition:transform .3s var(--ease)}
.mini:active{transform:scale(.9)}
#more{margin-top:40px}
.again{display:block;margin:72px auto 0}

/* 茶師だけ */
.adm{margin-top:80px;padding-top:28px;border-top:1px solid var(--line)}
.adm+.adm{margin-top:48px}
.adm h3,.hon h3{font-size:22px;font-weight:700;margin:0}
.lead{margin-top:10px;color:var(--ink-soft);font-size:14px}
.adm form{display:grid;gap:4px;margin-top:10px}
.sirusu{justify-self:start;margin-top:18px;border:0;border-radius:4px;background:var(--ink);color:var(--ground);padding:12px 22px;font-weight:700;cursor:pointer}
.kpi{margin-top:24px;display:grid;grid-template-columns:auto 1fr;column-gap:18px}
.kpi dt,.kpi dd{margin:0;padding:12px 0;border-top:1px solid var(--line)}
.kpi dt{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums;text-align:right;min-width:2ch}
.kpi dd{font-size:14px;align-self:center}
.kpi .key{color:var(--shu)}
.tbl{margin-top:18px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--ink-soft);font-size:12px}
code{overflow-wrap:anywhere;font-size:12px}
.pill{font-size:12px;color:var(--ink-soft)}
.list{margin-top:30px}
.list a{display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.ztree{margin-top:24px;width:100%;height:auto;display:block;overflow:visible}
.ztree path{fill:none;stroke:var(--ink-faint);stroke-width:1.2}
.ztree circle{fill:var(--ink)}
.ztree text{fill:var(--ink-soft);font-size:11px;font-family:var(--f-text)}
.hon{padding-top:56px}
.q{font-weight:700;font-size:36px;line-height:1.2;margin-top:36px}
.re-f{display:flex;gap:10px;align-items:flex-end;margin-top:8px}.re-f input{flex:1;min-width:0;border:0;border-bottom:1px solid var(--ink-faint);background:none;padding:8px 0;font-size:15px}
footer{margin-top:96px;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
footer nav a{color:var(--ink-soft);font-size:14px}
@media (max-width:370px){.name{font-size:50px}.nin .k{font-size:100px}.kazu b{font-size:32px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}#gate{display:none}.seal.pre{opacity:1}}

/* ================================================================
   11/19 POL STUDIO のもっこりの作りを深緑で
   飲む前の帯は、POL のワイン色の帯を深緑に置き換えた面。押す物だけが膨らむ
   白い地の押す物は白い布の膨らみに深緑の字。長押しの丸だけ深緑の膨らみ。朱は印と日付だけ
   ================================================================ */
:root{
  --seal:#b3362a; --shu:#2c5a3f; --shu-deep:#1d3d2a; --green:#2c5a3f;
  --night:#1f3a2b; --night-2:#2a4a37; --night-line:rgba(255,255,255,.14); --on-night-soft:#c9d6cc;
  --nkey:radial-gradient(130% 120% at 50% 0%,#3f6650 0%,#2c4d3a 55%,#223d2e 100%);
  --nkey-sh:inset 0 1px 1px rgba(255,255,255,.24),inset 0 -5px 10px rgba(4,20,10,.4),0 2px 2px rgba(6,22,12,.35),0 12px 20px -10px rgba(4,18,10,.7);
  --nkey-in:inset 0 4px 9px rgba(4,18,10,.55),inset 0 -1px 1px rgba(255,255,255,.1);
  --gkey:radial-gradient(130% 120% at 50% 0%,#5a9172 0%,#336a4a 45%,#22472f 100%);

function chain(holder){const back={};S.passes.forEach(p=>{back[p.to]=back[p.to]||p});const c=[];let n=holder,g=0;
  while(n&&g++<50){c.unshift(n);n=back[n]?.from}return c}

function rows(tg,nth){
  const c=myChain(tg),inC=new Set(c),used=new Set();const out=[];
  const pool=S.reviews.filter(r=>r.tea===tg.tea&&r.text);
  const rvOf=n=>{const r=pool.find(r=>r.holder===n&&!used.has(r));if(r)used.add(r);return r};
  c.forEach((n,i)=>{const you=i===c.length-1;
    if(you){const m=S.me.mine;
      out.push({you:true,who:(m&&label(m)?label(m)+"　":"")+"あなた　"+nth+"人目",word:m?m.text:(S.me.answers||[]).length?S.me.answers[0]+"の味":"まだ一言はありません",empty:!m&&!(S.me.answers||[]).length});return}
    const r=i===0?null:rvOf(n);
    out.push({who:i===0?"茶師":(r&&label(r))||i+"人目",word:r?said(r):i===0?"詰めて、封をした":"まだ一言はありません",empty:!r&&i!==0});
    const side=S.passes.filter(p=>p.from===n&&!inC.has(p.to)).map(p=>p.to);
    let quiet=0;side.forEach(x=>{const r2=rvOf(x);if(r2)out.push({branch:true,who:label(r2)||"ほかの席",word:said(r2)});else quiet++});
    if(quiet)out.push({branch:true,who:`ほかに${quiet}つの席へ`,word:""});
  });

  if(rest.length)out.push({other:true,who:"同じ封のほかの瓶から",word:""},...rest.slice(0,8).map(r=>({branch:true,ob:true,who:label(r)||"同じ封の席",word:r.text,reply:r.reply||""})));

function bindOrder(id){

  const tm=ymd(new Date(Date.now()+864e5)),min=cfg.otodoke&&cfg.otodoke>tm?cfg.otodoke:tm;d.min=min;if(!d.value||d.value<min)d.value=min;

  const sh=$("#o-sheet"),sum=()=>{const w=f.querySelector("input[name=o-wrap]:checked"),c=f.querySelector("input[name=o-card]:checked");const m=($("#o-msg")||{}).value||"";

  const C=2*Math.PI*80,DUR=1100;let prog=0,dir=0,last=0,raf=0,busy=false;
  ring.style.strokeDasharray=C;ring.style.strokeDashoffset=C;
  const need=()=>{const ask=[[kind==="gift"&&"#o-to","贈る方のお名前"],["#o-from","あなたのお名前"],["#o-date","届ける日"],["#o-tel","あなたの電話"]];
    for(const [sel,nm] of ask){if(sel&&!$(sel).value.trim())return [sel,nm]}return null};
  const tick=now=>{const dt=Math.min(now-last,50);last=now;prog=Math.max(0,Math.min(1,prog+dir*dt/(dir>0?DUR:DUR/2.2)));
    ring.style.strokeDashoffset=C*(1-prog);
    if(prog>=1){done();return}
    if(prog<=0&&dir<0){dir=0;S.pressing=false;return}
    raf=requestAnimationFrame(tick)};
  const start=e=>{if(busy)return;e.preventDefault();
    const miss=need();if(miss){hint.textContent=`先に、${miss[1]}を`;$(miss[0]).focus();return}
    S.pressing=true;dir=1;hold.classList.add("pressing");hint.textContent="そのまま";cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(tick)};
  const stop=()=>{if(dir!==1)return;dir=-1;hold.classList.remove("pressing");idle();cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(tick)};
  const done=async()=>{dir=0;busy=true;hold.classList.remove("pressing");hint.textContent="承っています";
    const o={tag:id,tea:tg.tea,kind,line:tg.tea,lineName:t.name||tg.tea,price:+cfg.price||0,to:kind==="gift"?$("#o-to").value.trim():"",from:$("#o-from").value.trim(),
      date:d.value,tel:$("#o-tel").value.trim(),
      wrap:kind==="gift"?((f.querySelector("input[name=o-wrap]:checked")||{}).value||""):"",card:kind==="gift"?((f.querySelector("input[name=o-card]:checked")||{}).value||""):"",msg:kind==="gift"?(($("#o-msg")||{}).value||"").trim().slice(0,60):"",by:S.uid||"",gen:myChain(tg).length,at:new Date().toISOString()};
    try{if(!S.uid)throw 0;const {ref,d:cur}=await myOrders();const list=cur.list||[];list.push(o);await ref.set({...cur,list})}
    catch(err){busy=false;S.pressing=false;prog=0;ring.style.strokeDashoffset=C;hint.textContent="この端末からは頼めませんでした。茶師に直接お電話ください。";return}
    try{navigator.vibrate&&navigator.vibrate([18,40,28])}catch(_){}
    const when=jday(o.date);
    if(kind==="gift"){(S.me.gifts??=[]).push({to:o.to,date:o.date})}else{S.me.bought=(S.me.bought||0)+1;S.kind="gift"}
    S.flash=kind==="gift"?`${esc(o.to)}様へ<br><b>${when}</b>にお届けします。`:`<b>${when}</b>に<br>お手元へお届けします。`;
    S.pressing=false;saveMe(id);render();
    setTimeout(()=>$("#uketa")?.scrollIntoView({behavior:reduce?"auto":"smooth",block:"center"}),150)};
  hold.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>hold.addEventListener(ev,stop));
  hold.addEventListener("keydown",e=>{if((e.key===" "||e.key==="Enter")&&!e.repeat)start(e)});
  hold.addEventListener("keyup",e=>{if(e.key===" "||e.key==="Enter")stop()});
  hold.addEventListener("contextmenu",e=>e.preventDefault());
  const t2=$("#tap2");if(t2){let armed=false;t2.onclick=()=>{if(busy)return;const miss=need();if(miss){hint.textContent=`先に、${miss[1]}を`;$(miss[0]).focus();return}
    if(!armed){armed=true;t2.textContent="もう一度押すと頼みます";hint.textContent="";return}
    prog=1;ring.style.strokeDashoffset=0;done()}}
}

function treeSVG(){
  const kids={},tos=new Set();S.passes.forEach(p=>{(kids[p.from]??=[]).push(p.to);tos.add(p.to)});
  const roots=Object.keys(kids).filter(k=>!tos.has(k));if(!roots.length)roots.push(MASTER);
  const levels=[];const seen=new Set();
  (function walk(n,d){if(seen.has(n))return;seen.add(n);(levels[d]??=[]).push(n);(kids[n]||[]).forEach(k=>walk(k,d+1))})(roots[0],0);
  const W=360,gy=64,pos={};
  levels.forEach((row,d)=>row.forEach((n,i)=>pos[n]={x:row.length===1?W/2:24+(W-48)*i/(row.length-1),y:26+d*gy}));
  const H=26+(levels.length-1)*gy+34;let o="";
  Object.entries(kids).forEach(([f,ts])=>ts.forEach(t=>{const a=pos[f],b=pos[t];if(a&&b)o+=`<path d="M${a.x} ${a.y} C${a.x} ${a.y+40} ${b.x} ${b.y-34} ${b.x} ${b.y}"/>`}));
  Object.entries(pos).forEach(([n,p])=>o+=`<circle cx="${p.x}" cy="${p.y}" r="3.6"/><text x="${p.x+8}" y="${p.y+16}">${esc(n)}</text>`);
  return `<svg class="ztree" viewBox="0 0 ${W} ${H}" role="img" aria-label="枝の全体">${o}</svg>`}

    ${gifts.length?`<div class="voices">${gifts.map((o,i)=>`<form class="link-f" data-i="${i}"><p class="who">${esc(o.date||"")}　${esc((o.tag||"").toUpperCase())} から</p>
      <p class="k">${esc(o.from)}様の席より　${esc(o.to)}様へ</p>
      <div class="re-f"><select aria-label="届ける瓶のタグ">${opt(free.length?free:ids,"")}</select><button class="textbtn" type="submit">この瓶で道につなげる</button></div>
      <p class="msg"></p></form>`).join("")}</div>`:`<p class="lead">つなぐ注文はありません</p>`}
    <h3 style="margin-top:34px;font-size:18px">手渡しの分</h3>
    <p class="lead">注文を通さずに渡した瓶だけ、ここで記します</p>
    <form id="pf">
      <div class="field"><label for="p-tag">タグ</label><select id="p-tag">${opt(ids,ids[0])}</select></div>
      <div class="two"><div class="field"><label for="p-from">渡した人</label><input id="p-from" value="${esc(MASTER)}" required></div>
      <div class="field"><label for="p-to">受け取った人</label><input id="p-to" required></div></div>
      <div class="field"><label for="p-via">間に入った店</label><input id="p-via"></div>
      <button class="sirusu" type="submit">記す</button><p class="msg" id="p-msg" aria-live="polite"></p>
    </form></section>`}
function bindWatashi(){
  const linked=new Set(S.passes.map(p=>p.order).filter(Boolean));
  const gifts=S.orders.filter(o=>o.kind==="gift"&&!linked.has(okey(o)));
  document.querySelectorAll(".link-f").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const o=gifts[+f.dataset.i],tag=f.querySelector("select").value,m=f.querySelector(".msg");
    if(!o||!tag)return;const from=(S.tags[o.tag]||{}).holder||o.from;
    try{await S.db.collection("passes").add({from,to:o.to,via:"",tag,order:okey(o),at:new Date().toISOString()});await S.db.doc("tags/"+tag).update({holder:o.to});m.textContent="つなぎました"}
    catch(err){m.textContent="つなげませんでした"}});
  const pf=$("#pf");if(pf){const pt=$("#p-tag");pt.onchange=()=>{$("#p-from").value=(S.tags[pt.value]||{}).holder||MASTER};
    pf.onsubmit=async e=>{e.preventDefault();const tag=pt.value,from=$("#p-from").value.trim(),to=$("#p-to").value.trim(),via=$("#p-via").value.trim();if(!to)return;
      try{await S.db.collection("passes").add({from,to,via,tag,at:new Date().toISOString()});await S.db.doc("tags/"+tag).update({holder:to});$("#p-msg").textContent="記しました"}
      catch(err){$("#p-msg").textContent="記せませんでした"}}}}
function bindAdmin(){
  bindWatashi();
  document.querySelectorAll(".cp").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.u);b.textContent="写しました"}catch(_){b.textContent="長押しで写してください"}});
  const save=(fid,mid,fn)=>{const f=$(fid);f.onsubmit=async e=>{e.preventDefault();try{await fn();$(mid).textContent="保存しました"}catch(err){$(mid).textContent="保存できませんでした"}}};
  save("#tf","#t-msg",()=>S.db.doc("tags/"+$("#t-id").value.toLowerCase()).set({kind:$("#t-kind").value,tea:$("#t-tea").value,holder:$("#t-holder").value.trim()}));
  save("#ef","#e-msg",()=>S.db.doc("teas/"+$("#e-id").value.toLowerCase()).set({name:$("#e-name").value,origin:$("#e-origin").value,vintage:$("#e-vintage").value?+$("#e-vintage").value:null,season:$("#e-season").value,umami:+$("#e-umami").value,shibumi:+$("#e-shibumi").value,story:$("#e-story").value}));
  document.querySelectorAll(".re-f").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const b=f.querySelector("button");try{await S.db.collection("reviews").doc(f.dataset.id).update({reply:f.querySelector("input").value.trim()});b.textContent="返しました"}catch(err){b.textContent="返せませんでした"}});
  save("#uf","#u-msg",()=>S.db.doc("config/site").set({url:$("#u-url").value.trim()}));
}

/* ---------- 自分の記録（その人だけが読める） ---------- */
function loadMe(id){S.me=store("nj-me-"+id)||{}}
function saveMe(id){store("nj-me-"+id,S.me);if(S.db&&S.uid){S.db.collection("data/users/"+S.uid).doc("tag-"+id).set(S.me).catch(()=>{})}}

/* ---------- 入口と描画 ---------- */
let lastRoute=null,gateT=[];
function gateRun(force){
  const g=$("#gate");if(reduce){S.gateDone=true;return}
  gateT.forEach(clearTimeout);g.className="";g.hidden=false;S.gateDone=false;
  const through=()=>{gateT.forEach(clearTimeout);g.className="through";S.gateDone=true;
    const s=$("#seal1"),nm=$("#name1");if(nm&&S.stamped!==lastRoute){nm.classList.remove("pre");nm.classList.add("up")}if(s&&S.stamped!==lastRoute){s.classList.remove("pre");s.classList.add("stamp");S.stamped=lastRoute;drawTree(true)}
    gateT=[setTimeout(()=>g.hidden=true,1200)]};
  gateT=[setTimeout(()=>g.classList.add("open"),500),setTimeout(()=>g.classList.add("in"),1500),setTimeout(through,2100)];
  g.onclick=through}
function render(){
  const v=$("#view"),h=route();
  if(!S.ready)return;
  if(!S.db){v.innerHTML=`<div class="in"><section class="hon"><svg class="seal" viewBox="0 0 64 64" aria-hidden="true">${SEAL}</svg><p class="q">つながりません<br>開き直してください</p></section></div>`;return}
  if(h!==lastRoute){lastRoute=h;S.flash="";S.fresh=-1;S.kind="gift";S.asking=false;S.treeDone=false;if(S.tags[h])loadMe(h)}
  // 書きかけの欄は描き直しても残す
  const keep={};v.querySelectorAll("input[id],textarea[id],select[id]").forEach(e=>keep[e.id]=e.type==="radio"||e.type==="checkbox"?e.checked:e.value);
  if(h==="admin"&&S.owner){v.innerHTML=`<div class="in">${admin()}</div>`;bindAdmin()}
  else if(S.tags[h]){v.innerHTML=tap(h);
    Object.entries(keep).forEach(([k,val])=>{const e=document.getElementById(k);if(!e||e.closest("#gate"))return;if(e.type==="radio"||e.type==="checkbox")e.checked=val;else if(e.type!=="date"||val)e.value=val});
    bindTap(h)}
  else v.innerHTML=`<div class="in">${index()}</div>`;
}
addEventListener("hashchange",()=>{render();scrollTo(0,0)});
addEventListener("resize",()=>drawTree(false));
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>drawTree(false));
(async()=>{
  try{history.scrollRestoration="manual"}catch(e){}
  if(/^[a-z]\d+/.test(route())&&!store("nj-gate")){store("nj-gate",1);gateRun()}else S.gateDone=true;
  $("#gate .gate-word").textContent=WORDS.gate;
  const timer=setTimeout(()=>{if(!S.ready){S.ready=true;$("#view").innerHTML=`<section class="hon"><p class="q" style="font-size:26px">つながりません。電波の良い所で開き直してください</p></section>`}},10000);
  const [db,user]=await Promise.all([window.claude?.use?.("db")??null,window.claude?.use?.("user")??null]);
  S.db=db;S.owner=user?await user.isOwner().catch(()=>false):false;S.uid=user?await user.id().catch(()=>null):null;
  if(!db){clearTimeout(timer);S.ready=true;render();return}
  const map=s=>Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));
  let got=0;const need=S.owner?6:5;const mark=()=>{if(++got>=need){clearTimeout(timer);S.ready=true}render()};
  const busy=()=>S.pressing||document.activeElement?.matches?.("input,textarea,select");
  const once=f=>{let d=false;return s=>{f(s);if(!d){d=true;mark()}else if(S.ready&&!busy())render()}};
  const fail=()=>{};
  db.collection("teas").onSnapshot(once(s=>S.teas=map(s)),fail);
  db.collection("tags").onSnapshot(once(s=>S.tags=map(s)),fail);
  db.collection("reviews").orderBy("at","desc").onSnapshot(once(s=>S.reviews=s.docs.map(d=>({...d.data(),_id:d.id}))),fail);
  db.collection("passes").orderBy("at").onSnapshot(once(s=>S.passes=s.docs.map(d=>d.data())),fail);
  db.doc("config/site").onSnapshot(once(s=>S.site=s.exists?s.data():{}),fail);
  if(S.owner)db.collection("orders").onSnapshot(once(s=>S.orders=(S.orderDocs=s.docs.map(d=>d.data()),s.docs).flatMap(d=>d.data().list||[]).sort((a,b)=>(a.at||"").localeCompare(b.at||""))),fail);
})();
}
</script>
